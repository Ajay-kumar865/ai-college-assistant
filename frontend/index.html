<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>University Assistant Widget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg-glass: rgba(15, 23, 42, 0.75);
      --border-glass: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --font-family: 'Inter', sans-serif;
    }

    body {
      margin: 0;
      font-family: var(--font-family);
      background-color: #f1f5f9;
    }

    /* Dummy background for demonstration */
    .dummy-bg {
      min-height: 100vh;
      padding: 2rem;
      background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
      color: #333;
      box-sizing: border-box;
    }

    /* 
          Floating Toggle Button
        */
    #widget-toggle-btn {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), #818cf8);
      color: white;
      border: none;
      box-shadow: 0 10px 25px rgba(79, 70, 229, 0.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease;
    }

    #widget-toggle-btn:hover {
      transform: scale(1.1) translateY(-5px);
      box-shadow: 0 15px 35px rgba(79, 70, 229, 0.6);
    }

    .pulse-anim {
      animation: pulse 2s infinite cubic-bezier(0.4, 0, 0.6, 1);
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.8;
      }
    }

    /*
          Widget Container - Covers ~1/6th of screen space
          We use 33vw width and 50vh height (0.33 * 0.5 = 0.165 area constraint)
        */
    #university-widget-container {
      position: fixed;
      bottom: 6rem;
      /* Above the button */
      right: 2rem;
      width: 33vw;
      height: 50vh;
      min-width: 320px;
      min-height: 480px;
      max-width: 450px;
      max-height: 80vh;

      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-glass);
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);

      display: flex;
      flex-direction: column;
      z-index: 9998;
      overflow: hidden;
      color: var(--text-main);

      /* Animation defaults */
      transform-origin: bottom right;
      transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1);
    }

    #university-widget-container.widget-hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.8) translateY(20px);
    }

    #university-widget-container.widget-visible {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1) translateY(0);
    }

    /* Header */
    .widget-header {
      padding: 1.25rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-glass);
      background: rgba(255, 255, 255, 0.05);
    }

    .widget-title {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 600;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      padding: 0.4rem;
      transition: all 0.2s ease;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: white;
    }

    /* Body */
    .widget-body {
      flex: 1;
      padding: 1.5rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    /* Scrollbar styling for widget body */
    .widget-body::-webkit-scrollbar {
      width: 6px;
    }

    .widget-body::-webkit-scrollbar-track {
      background: transparent;
    }

    .widget-body::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
    }

    .message {
      padding: 1rem 1.25rem;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.5;
      max-width: 85%;
      animation: fadeInSlideUp 0.3s ease forwards;
    }

    @keyframes fadeInSlideUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .system-message {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      border-top-left-radius: 4px;
      align-self: flex-start;
    }

    .user-message {
      background: var(--primary);
      color: white;
      border-top-right-radius: 4px;
      align-self: flex-end;
    }

    /* Footer */
    .widget-footer {
      padding: 1.25rem;
      border-top: 1px solid var(--border-glass);
      background: rgba(0, 0, 0, 0.2);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      box-sizing: border-box;
      width: 100%;
    }

    #widget-input {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-glass);
      border-radius: 20px;
      padding: 0.75rem 1.25rem;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s ease;
      width: 100%;
      box-sizing: border-box;
    }

    #widget-input::placeholder {
      color: var(--text-muted);
    }

    #widget-input:focus {
      border-color: var(--primary);
      background: rgba(255, 255, 255, 0.1);
      box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.2);
    }

    .interact-btn {
      background: var(--primary);
      color: white;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      flex-shrink: 0;
    }

    .interact-btn:hover {
      background: var(--primary-hover);
      transform: scale(1.05);
    }
  </style>
</head>

<body>

  <!-- This represents the university website content -->
  <main class="dummy-bg">
    <h1>University Portal</h1>
    <p>Scroll down or look at the bottom right corner to interact with the assistant widget.</p>
  </main>

  <!-- Widget Container -->
  <div id="university-widget-container" class="widget-hidden">
    <div class="widget-header">
      <div class="widget-title">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" />
        </svg>
        <span>University Assistant</span>
      </div>
      <button id="widget-close-btn" class="icon-btn" aria-label="Close widget">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
    <div class="widget-body">
      <div class="message system-message">
        Hello! How can I help you with your university queries today?
      </div>
    </div>
    <div class="widget-footer">
      <input type="text" placeholder="Type your question..." id="widget-input">
      <button id="widget-send-btn" class="icon-btn interact-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>

  <!-- Toggle Button -->
  <button id="widget-toggle-btn" class="pulse-anim" aria-label="Open Assistant">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round" class="chat-icon">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
    </svg>
  </button>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const toggleBtn = document.getElementById('widget-toggle-btn');
      const closeBtn = document.getElementById('widget-close-btn');
      const widgetContainer = document.getElementById('university-widget-container');
      const sendBtn = document.getElementById('widget-send-btn');
      const widgetInput = document.getElementById('widget-input');
      const widgetBody = document.querySelector('.widget-body');

      let isWidgetOpen = false;

      // Toggle widget visibility
      const toggleWidget = () => {
        isWidgetOpen = !isWidgetOpen;
        if (isWidgetOpen) {
          widgetContainer.classList.remove('widget-hidden');
          widgetContainer.classList.add('widget-visible');
          // Remove pulse animation when opened
          toggleBtn.classList.remove('pulse-anim');
          // Auto focus input
          setTimeout(() => widgetInput.focus(), 300);
        } else {
          widgetContainer.classList.remove('widget-visible');
          widgetContainer.classList.add('widget-hidden');
        }
      };

      toggleBtn.addEventListener('click', toggleWidget);
      closeBtn.addEventListener('click', toggleWidget);

      // Handle sending message
      const sendMessage = () => {
        const text = widgetInput.value.trim();
        if (!text) return;

        // Add user message
        const userMsg = document.createElement('div');
        userMsg.classList.add('message', 'user-message');
        userMsg.textContent = text;
        widgetBody.appendChild(userMsg);

        // Clear input and scroll to bottom
        widgetInput.value = '';
        widgetBody.scrollTop = widgetBody.scrollHeight;

        // Simulate thinking and system response
        setTimeout(() => {
          const sysMsg = document.createElement('div');
          sysMsg.classList.add('message', 'system-message');
          sysMsg.textContent = "I'm a demo assistant. I've received your query about: " + text;
          widgetBody.appendChild(sysMsg);
          widgetBody.scrollTop = widgetBody.scrollHeight;
        }, 800);
      };

      sendBtn.addEventListener('click', sendMessage);

      // Send on Enter key
      widgetInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          sendMessage();
        }
      });
    });
  </script>
</body>

</html>
