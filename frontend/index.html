<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>AI Assistant</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
/* (UNCHANGED CSS — kept exactly as you gave) */
body {
  font-family: Inter, Arial, sans-serif;
  background: #f4f6fb;
}

.status {
  font-size: 11px;
  color: #888;
  text-align: right;
  margin-top: 2px;
}

.user-typing {
  font-size: 12px;
  color: #777;
  display: flex;
  gap: 4px;
}

.user-typing span,
.typing span {
  width: 6px;
  height: 6px;
  background: #999;
  border-radius: 50%;
  animation: blink 1.4s infinite both;
}

.user-typing span:nth-child(2),
.typing span:nth-child(2){animation-delay:.2s}
.user-typing span:nth-child(3),
.typing span:nth-child(3){animation-delay:.4s}

@keyframes blink {
  0%{opacity:.2}
  20%{opacity:1}
  100%{opacity:.2}
}

#ai-bubble {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: #1e90ff;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

#ai-box {
  position: fixed;
  bottom: 90px;
  right: 20px;
  width: 360px;
  height: 520px;
  background: white;
  border-radius: 18px;
  box-shadow: 0 20px 40px rgba(0,0,0,.15);
  display: none;
  flex-direction: column;
}

#ai-header {
  background: linear-gradient(135deg, #1e90ff, #0066ff);
  color: white;
  padding: 14px;
  font-weight: 600;
}

#ai-messages {
  flex: 1;
  padding: 16px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.msg {
  max-width: 85%;
  padding: 10px 12px;
  border-radius: 14px;
  font-size: 14px;
}

.msg.user {
  background: #1e90ff;
  color: white;
  align-self: flex-end;
}

.msg.ai {
  background: #f1f3f7;
  align-self: flex-start;
}

.timestamp {
  font-size: 11px;
  color: #777;
}

.actions {
  display: flex;
  gap: 10px;
  font-size: 12px;
  margin-top: 4px;
}

.actions button {
  border: none;
  background: none;
  cursor: pointer;
  color: #1e90ff;
}

#ai-input {
  padding: 12px;
  display: flex;
  gap: 8px;
  border-top: 1px solid #eee;
}

#ai-input input {
  flex: 1;
  padding: 10px 14px;
  border-radius: 20px;
  border: 1px solid #ddd;
}

#ai-input button {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: none;
  background: #1e90ff;
  color: white;
  cursor: pointer;
}
</style>
</head>

<body>

<div id="ai-bubble">AI</div>

<div id="ai-box">
  <div id="ai-header">We are online!</div>
  <div id="ai-messages"></div>
  <div id="ai-input">
    <input id="userInput" placeholder="Enter your message..." />
    <button onclick="sendMessage()">➤</button>
  </div>
</div>

<script>
const bubble = document.getElementById("ai-bubble");
const box = document.getElementById("ai-box");
const messages = document.getElementById("ai-messages");
const input = document.getElementById("userInput");

let userTypingDiv = null;
let userTypingTimer = null;
let aiTypingDiv = null;
let aiTypingTimer = null;

bubble.onclick = () => {
  box.style.display = box.style.display === "flex" ? "none" : "flex";
  if (!messages.innerHTML) showWelcome();
};

function timeNow() {
  return new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}

function showWelcome() {
  const ai = document.createElement("div");
  ai.className = "msg ai";
  messages.appendChild(ai);

  const text = "Hello, I am your AI assistant. How can I help you?";
  let i = 0;
  const interval = setInterval(() => {
    ai.innerText = text.slice(0, i++);
    if (i > text.length) clearInterval(interval);
  }, 30);
}

function showUserTyping() {
  if (userTypingDiv) return;
  userTypingDiv = document.createElement("div");
  userTypingDiv.className = "user-typing";
  userTypingDiv.innerHTML = `User is typing <span></span><span></span><span></span>`;
  messages.appendChild(userTypingDiv);
}

function hideUserTyping() {
  if (userTypingDiv) {
    userTypingDiv.remove();
    userTypingDiv = null;
  }
}

function showAITyping() {
  if (aiTypingDiv) return;
  aiTypingDiv = document.createElement("div");
  aiTypingDiv.className = "msg ai";
  aiTypingDiv.innerHTML = `<div class="typing"><span></span><span></span><span></span></div>`;
  messages.appendChild(aiTypingDiv);
}

function hideAITyping() {
  if (aiTypingDiv) {
    aiTypingDiv.remove();
    aiTypingDiv = null;
  }
}

function sendMessage(prefill=null) {
  hideUserTyping();
  const text = prefill || input.value.trim();
  if (!text) return;
  input.value = "";

  const wrapper = document.createElement("div");
  wrapper.style.alignSelf = "flex-end";

  const user = document.createElement("div");
  user.className = "msg user";
  user.innerText = text;

  const status = document.createElement("div");
  status.className = "status";
  status.innerText = "Sending…";

  wrapper.append(user, status);
  messages.appendChild(wrapper);

  const ut = document.createElement("div");
  ut.className = "timestamp";
  ut.innerText = "You • " + timeNow();
  messages.appendChild(ut);

  aiTypingTimer = setTimeout(showAITyping, 400);

  fetch("http://127.0.0.1:8000/chat", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({message:text})
  })
  .then(r=>r.json())
  .then(d=>{
    clearTimeout(aiTypingTimer);
    hideAITyping();
    status.innerText = "Sent";

    const ai = document.createElement("div");
    ai.className = "msg ai";
    ai.innerHTML = marked.parse(d.response);
    messages.appendChild(ai);

    const at = document.createElement("div");
    at.className = "timestamp";
    at.innerText = "AI • " + timeNow();
    messages.appendChild(at);

    addActions(ai, d.response, text);
  });
}

function addActions(block, text, query) {
  const actions = document.createElement("div");
  actions.className = "actions";

  actions.innerHTML = `
    <button onclick="navigator.clipboard.writeText(\`${text}\`)">Copy</button>
    <button onclick="sendMessage(\`${query}\`)">Regenerate</button>
    <button onclick="sendFeedback('like')">👍</button>
    <button onclick="sendFeedback('dislike')">👎</button>
  `;

  block.appendChild(actions);
}

/* ✅ FIXED: feedback now adds visible message */
function sendFeedback(type) {
  fetch("http://127.0.0.1:8000/feedback", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      feedbackType:type,
      timestamp:new Date().toISOString()
    })
  });

  const ai = document.createElement("div");
  ai.className = "msg ai";
  ai.innerText =
    type === "like"
      ? "Thanks for the positive feedback 👍"
      : "Thanks for the feedback 👎, we’ll improve.";
  messages.appendChild(ai);

  const at = document.createElement("div");
  at.className = "timestamp";
  at.innerText = "AI • " + timeNow();
  messages.appendChild(at);
}

input.addEventListener("input", () => {
  showUserTyping();
  clearTimeout(userTypingTimer);
  userTypingTimer = setTimeout(hideUserTyping, 700);
});

input.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    e.preventDefault();
    sendMessage();
  }
});
</script>

</body>
</html>
