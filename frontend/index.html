<body>
  <main class="app" aria-label="AI College Assistant chat">
    <header class="header">
      <div>
        <h1 class="title">🎓 AI College Assistant</h1>
        <p class="subtitle">Reliable chat UI aligned with your FastAPI routes.</p>
      </div>
      <div id="status" class="status">Idle</div>
    </header>

    <section id="messages" class="messages" aria-live="polite" aria-label="Conversation"></section>

    <section class="composer">
      <div class="input-row">
        <textarea id="messageInput" placeholder="Ask about admissions, notices, events, or documents..." aria-label="Type your question"></textarea>
        <button id="sendButton" type="button">Send</button>
      </div>
      <div class="controls">
        <div class="hint">Enter to send • Shift+Enter for newline.</div>
        <button id="clearButton" class="linkish" type="button">Clear conversation</button>
      </div>
    </section>
  </main>

  <script>
    const API_BASE = "http://127.0.0.1:8000";
    const STORAGE_KEY = "ai_college_assistant_chat_v1";

    const elements = {
      messages: document.getElementById("messages"),
      status: document.getElementById("status"),
      input: document.getElementById("messageInput"),
      sendButton: document.getElementById("sendButton"),
      clearButton: document.getElementById("clearButton"),
    };

    const state = {
      messages: [],
      pendingController: null,
      isSending: false,
    };

    function setStatus(label) {
      elements.status.textContent = label;
    }

    function formatTime(value) {
      return new Date(value).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    function sanitizeToText(value) {
      if (value === null || value === undefined) return "";
      return String(value);
    }

    function normalizeSources(sources) {
      if (!Array.isArray(sources)) return [];
      return sources.map((source) => {
        if (typeof source === "string") return source;
        if (source && typeof source === "object") {
          const keys = Object.keys(source);
          if (!keys.length) return "{}";
          const compact = keys.slice(0, 3).map((key) => `${key}: ${source[key]}`).join(" | ");
          return compact;
        }
        return String(source);
      });
    }

    function renderMessage(message) {
      const wrapper = document.createElement("article");
      wrapper.className = `message ${message.role} ${message.error ? "error" : ""}`;
      wrapper.textContent = sanitizeToText(message.text);

      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = `${message.role === "user" ? "You" : "Assistant"} • ${formatTime(message.timestamp)}`;
      wrapper.appendChild(meta);

      if (message.sources?.length) {
        const sourceBlock = document.createElement("section");
        sourceBlock.className = "sources";
        sourceBlock.innerHTML = "<strong>Sources</strong>";

        const list = document.createElement("ul");
        message.sources.forEach((entry) => {
          const item = document.createElement("li");
          item.textContent = entry;
          list.appendChild(item);
        });

        sourceBlock.appendChild(list);
        wrapper.appendChild(sourceBlock);
      }

      elements.messages.appendChild(wrapper);
      elements.messages.scrollTop = elements.messages.scrollHeight;
    }

    function renderAll() {
      elements.messages.innerHTML = "";
      state.messages.forEach(renderMessage);
    }

    function persist() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.messages));
    }

    function addMessage(partial) {
      const message = {
        role: partial.role,
        text: sanitizeToText(partial.text),
        timestamp: partial.timestamp || new Date().toISOString(),
        sources: partial.sources || [],
        error: Boolean(partial.error),
      };
      state.messages.push(message);
      renderMessage(message);
      persist();
    }

    function setSending(sending) {
      state.isSending = sending;
      elements.sendButton.disabled = sending;
      elements.input.disabled = sending;
      setStatus(sending ? "Waiting for response..." : "Idle");
    }

    async function sendMessage() {
      if (state.isSending) return;
      const text = elements.input.value.trim();
      if (!text) return;

      addMessage({ role: "user", text });
      elements.input.value = "";

      const controller = new AbortController();
      state.pendingController = controller;
      setSending(true);

      try {
        const response = await fetch(`${API_BASE}/chat`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, timestamp: new Date().toISOString() }),
          signal: controller.signal,
        });

        let payload = null;
        try {
          payload = await response.json();
        } catch {
          payload = null;
        }

        if (!response.ok) {
          throw new Error(payload?.detail || `Request failed with status ${response.status}`);
        }

        addMessage({
          role: "bot",
          text: payload?.response || "No response body returned.",
          sources: normalizeSources(payload?.sources),
        });
      } catch (error) {
        addMessage({
          role: "bot",
          text: `Could not complete request: ${error?.message || "Unknown error"}`,
          error: true,
        });
      } finally {
        state.pendingController = null;
        setSending(false);
        elements.input.focus();
      }
    }

    function clearConversation() {
      if (state.isSending && state.pendingController) {
        state.pendingController.abort();
      }
      state.messages = [];
      persist();
      renderAll();
      addMessage({ role: "bot", text: "Conversation cleared. Ask a new question anytime." });
    }
