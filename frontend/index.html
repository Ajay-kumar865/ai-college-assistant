<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI College Assistant</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background-color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .chat-container {
      width: 100%;
      max-width: 700px;
      height: 90vh;
      max-height: 700px;
      background-color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background-color: #1a365d;
      color: #ffffff;
      padding: 20px;
      text-align: center;
    }

    .chat-header h1 {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .chat-header p {
      font-size: 0.85rem;
      opacity: 0.85;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.5;
      font-size: 0.95rem;
    }

    .message.user {
      align-self: flex-end;
      background-color: #1a365d;
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .message.assistant {
      align-self: flex-start;
      background-color: #f0f4f8;
      color: #1a202c;
      border-bottom-left-radius: 4px;
    }

    .message .answer {
      margin-bottom: 0;
    }

    .message .sources {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #d1d5db;
      font-size: 0.85rem;
    }

    .message .sources-title {
      font-weight: 600;
      margin-bottom: 6px;
      color: #4a5568;
    }

    .message .sources-list {
      list-style: none;
      padding-left: 0;
    }

    .message .sources-list li {
      padding: 4px 0;
      padding-left: 16px;
      position: relative;
      color: #2d3748;
    }

    .message .sources-list li::before {
      content: "•";
      position: absolute;
      left: 4px;
      color: #718096;
    }

    .thinking {
      align-self: flex-start;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      background-color: #f0f4f8;
      border-radius: 12px;
      border-bottom-left-radius: 4px;
      color: #718096;
      font-size: 0.95rem;
    }

    .thinking-dots {
      display: flex;
      gap: 4px;
    }

    .thinking-dots span {
      width: 6px;
      height: 6px;
      background-color: #718096;
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }

    .thinking-dots span:nth-child(1) {
      animation-delay: -0.32s;
    }

    .thinking-dots span:nth-child(2) {
      animation-delay: -0.16s;
    }

    @keyframes bounce {
      0%, 80%, 100% {
        transform: scale(0);
      }
      40% {
        transform: scale(1);
      }
    }

    .chat-input-container {
      padding: 16px 20px;
      background-color: #ffffff;
      border-top: 1px solid #e2e8f0;
    }

    .chat-input-wrapper {
      display: flex;
      gap: 12px;
    }

    .chat-input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .chat-input:focus {
      border-color: #1a365d;
      box-shadow: 0 0 0 3px rgba(26, 54, 93, 0.1);
    }

    .chat-input::placeholder {
      color: #a0aec0;
    }

    .send-button {
      padding: 12px 24px;
      background-color: #1a365d;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .send-button:hover {
      background-color: #2c5282;
    }

    .send-button:disabled {
      background-color: #a0aec0;
      cursor: not-allowed;
    }

    @media (max-width: 600px) {
      body {
        padding: 0;
      }

      .chat-container {
        height: 100vh;
        max-height: none;
        border-radius: 0;
      }

      .message {
        max-width: 90%;
      }

      .chat-header h1 {
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <h1>AI College Assistant</h1>
      <p>Ask me anything about college life, academics, or campus resources</p>
    </div>
    
    <div class="chat-messages" id="chatMessages">
      <div class="message assistant">
        <p class="answer">Hello! I'm your AI College Assistant. How can I help you today?</p>
      </div>
    </div>
    
    <div class="chat-input-container">
      <div class="chat-input-wrapper">
        <input 
          type="text" 
          class="chat-input" 
          id="userInput" 
          placeholder="Type your question here..."
          autocomplete="off"
        >
        <button class="send-button" id="sendButton">Send</button>
      </div>
    </div>
  </div>

  <script>
    const chatMessages = document.getElementById('chatMessages');
    const userInput = document.getElementById('userInput');
    const sendButton = document.getElementById('sendButton');

    const API_ENDPOINT = 'http://127.0.0.1:8000/chat';

    function addMessage(content, isUser, sources = []) {
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${isUser ? 'user' : 'assistant'}`;

      let html = `<p class="answer">${escapeHtml(content)}</p>`;

      if (!isUser && sources && sources.length > 0) {
        html += `
          <div class="sources">
            <p class="sources-title">Sources:</p>
            <ul class="sources-list">
              ${sources.map(source => `<li>${escapeHtml(source)}</li>`).join('')}
            </ul>
          </div>
        `;
      }

      messageDiv.innerHTML = html;
      chatMessages.appendChild(messageDiv);
      scrollToBottom();
    }

    function addThinkingIndicator() {
      const thinkingDiv = document.createElement('div');
      thinkingDiv.className = 'thinking';
      thinkingDiv.id = 'thinkingIndicator';
      thinkingDiv.innerHTML = `
        <span>Thinking</span>
        <div class="thinking-dots">
          <span></span>
          <span></span>
          <span></span>
        </div>
      `;
      chatMessages.appendChild(thinkingDiv);
      scrollToBottom();
    }

    function removeThinkingIndicator() {
      const indicator = document.getElementById('thinkingIndicator');
      if (indicator) {
        indicator.remove();
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function scrollToBottom() {
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function setInputEnabled(enabled) {
      userInput.disabled = !enabled;
      sendButton.disabled = !enabled;
    }

    async function sendMessage() {
      const query = userInput.value.trim();
      if (!query) return;

      addMessage(query, true);
      userInput.value = '';
      setInputEnabled(false);
      addThinkingIndicator();

      try {
        const response = await fetch(API_ENDPOINT, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ query }),
        });

        if (!response.ok) {
          throw new Error(`Server error: ${response.status}`);
        }

        const data = await response.json();
        removeThinkingIndicator();
        addMessage(data.answer, false, data.sources || []);
      } catch (error) {
        removeThinkingIndicator();
        addMessage('Sorry, I encountered an error. Please make sure the backend server is running and try again.', false);
        console.error('Error:', error);
      } finally {
        setInputEnabled(true);
        userInput.focus();
      }
    }

    sendButton.addEventListener('click', sendMessage);

    userInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    userInput.focus();
  </script>
</body>
</html>
